<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stall Manager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root { --teal:#0F5257; --pandan:#3F7D3A; --sambal:#C8372D; --kuning:#E8A33D; --ink:#1C2B2D;
            --bs-body-bg:#F3F6F5; --bs-body-color:var(--ink); }
    h1, h2, h3, .brand, .stat-num { font-family:'Bricolage Grotesque', system-ui, sans-serif; }
    .topbar { background:var(--teal); }
    .topbar .brand { color:#fff; font-size:1.25rem; font-weight:800; text-decoration:none; }
    .topbar .nav-link { color:#cfe3e1; border-bottom:2px solid transparent; }
    .topbar .nav-link.active { color:#fff; border-bottom-color:var(--kuning); }
    .panel { background:#fff; border:1px solid #d9e2e0; border-radius:.5rem; padding:1.25rem; }
    .stat-num { font-size:2rem; font-weight:800; line-height:1.15; }
    .table { --bs-table-bg:#fff; }
    .low-row { --bs-table-bg:#fbeceb; }
    .badge-paid { background:var(--pandan); }
    .badge-unpaid { background:var(--sambal); }
    .btn-stall { background:var(--kuning); border:0; color:var(--ink); font-weight:600; }
    .btn-stall:hover { background:#d4922b; color:var(--ink); }
  </style>
</head>
<body>
  <nav class="topbar mb-4">
    <div class="container d-flex flex-wrap align-items-center justify-content-between py-2">
      <a href="{{ url_for('index') }}" class="brand">Stall Manager</a>
      <ul class="nav">
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'index' }}" href="{{ url_for('index') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'inventory' }}" href="{{ url_for('inventory') }}">Inventory</a></li>
      </ul>
    </div>
  </nav>

  <main class="container pb-5">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ 'danger' if cat in ('danger', 'error') else 'success' }}" role="alert">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
